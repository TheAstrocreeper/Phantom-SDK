name: Receive window experiment
on:
  push:
    branches: ['codex/receive-window-lab']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rtt: ['80', '400']
    env:
      PHANTOM_SHAPED_RTT_MS: '${{ matrix.rtt }}'
      PHANTOM_SHAPED_LOSS: '0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-name-pattern='96-slot experiment' tests/file-window.test.js
      - run: npm ci --prefix tools/swarm
      - run: sudo apt-get update && sudo apt-get install -y iproute2 socat
      - run: echo "PHANTOM_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: bash tools/perf/delivery-native/coordinator-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receive-window-rtt-${{ matrix.rtt }}
          path: tools/perf/delivery-native/coordinator-results-*/
          if-no-files-found: error

name: Early range validation
on:
  push:
    branches: ['codex/early-range-validation']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix tools/swarm
      - run: node --test tests/distribution-progress.test.js tests/distribution-lifecycle.test.js tests/distribution-recipients.test.js tests/distribution-batch-ownership.test.js
      - run: PHANTOM_SCOUT_AGREED=1 PHANTOM_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node tools/perf/scout-fragment-browser.mjs

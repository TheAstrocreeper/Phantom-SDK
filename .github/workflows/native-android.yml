name: Native Android JNI build
on:
  push:
    branches: [codex/native-bulk-transport]
    paths:
      - 'packages/phantom-tunnel/native/**'
      - 'packages/phantom-tunnel/tools/build-android.mjs'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cross toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "PHANTOM_LIBJUICE_SOURCE=$RUNNER_TEMP/libjuice" >> "$GITHUB_ENV"
          git clone https://github.com/paullouisageneau/libjuice.git "$RUNNER_TEMP/libjuice"
          git -C "$RUNNER_TEMP/libjuice" checkout cb523763255f241442da1fbdd72c498f33a54b35
      - name: Rust core and JNI for Android 13 arm64
        run: node packages/phantom-tunnel/tools/build-android.mjs aarch64-linux-android
      - name: Inspect target libraries
        run: |
          file packages/phantom-tunnel/native/target/android-jniLibs/arm64-v8a/*.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h packages/phantom-tunnel/native/target/android-jniLibs/arm64-v8a/libphantom_tunnel_jni.so
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-tunnel-android-arm64
          path: packages/phantom-tunnel/native/target/android-jniLibs/arm64-v8a/*.so
          if-no-files-found: error

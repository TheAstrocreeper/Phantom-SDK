name: Native tunnel prototype
on:
  push:
    branches: [codex/native-bulk-transport]
    paths:
      - 'packages/phantom-tunnel/src/**'
      - 'packages/phantom-tunnel/browser-extension/**'
      - 'packages/phantom-tunnel/native/src/**'
      - 'packages/phantom-tunnel/native/ice-shim/**'
      - 'packages/phantom-tunnel/native/jni/**'
      - 'packages/phantom-tunnel/native/*.mjs'
      - 'packages/phantom-tunnel/native/*.py'
      - 'packages/phantom-tunnel/native/*.toml'
      - 'packages/phantom-tunnel/native/Cargo.lock'
      - 'packages/phantom-tunnel/native/build.rs'
      - 'packages/phantom-tunnel/native/phantom_tunnel.h'
      - 'packages/phantom-tunnel/tools/**'
      - 'packages/phantom-tunnel/package.json'
      - 'packages/phantom-core/src/bulk-control.js'
      - 'tests/*bulk*'
      - 'tests/fixtures/bulk-network.js'
      - 'tests/*helper*'
      - '.github/workflows/native-tunnel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native dependencies
        run: |
          export PHANTOM_LIBJUICE_SOURCE="$RUNNER_TEMP/libjuice"
          echo "PHANTOM_LIBJUICE_SOURCE=$PHANTOM_LIBJUICE_SOURCE" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          git clone https://github.com/paullouisageneau/libjuice.git "$PHANTOM_LIBJUICE_SOURCE"
          git -C "$PHANTOM_LIBJUICE_SOURCE" checkout cb523763255f241442da1fbdd72c498f33a54b35
          npm ci
      - name: SDK and helper policy
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Native sockets and helper protocol
        run: npm --prefix packages/phantom-tunnel run test:native
      - name: JNI binding
        run: npm --prefix packages/phantom-tunnel run test:jni
      - name: Native lint
        run: cargo clippy --locked --all-targets --manifest-path packages/phantom-tunnel/native/Cargo.toml -- -D warnings
      - name: Chromium dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/phantom-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/phantom-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual page extension helper path
        run: |
          export PHANTOM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/phantom-browser/node_modules/playwright/index.mjs"
          node --test packages/phantom-tunnel/native/test-browser-helper.mjs
      - name: Package Linux helper
        run: |
          cargo build --locked --release --bin phantom_helper --manifest-path packages/phantom-tunnel/native/Cargo.toml
          strip --strip-unneeded packages/phantom-tunnel/native/target/release/phantom_helper
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-helper-linux-x64
          path: packages/phantom-tunnel/native/target/release/phantom_helper
          if-no-files-found: error

name: Barebones SDK page
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'tools/sdk-test/**'
      - '.github/workflows/sdk-page.yml'
permissions:
  contents: read
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix tools/swarm
      - run: cd tools/swarm && npx playwright install --with-deps chromium --only-shell
      - run: node --test tools/sdk-test/harness.test.mjs
      - run: node tools/sdk-test/build.mjs
      - run: node tools/sdk-test/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-page-check
          path: tools/sdk-test/reports/
          if-no-files-found: warn

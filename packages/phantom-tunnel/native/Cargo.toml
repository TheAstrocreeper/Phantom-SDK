[package]
name = "phantom-tunnel-native"
version = "0.0.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
sha2 = "0.10"
